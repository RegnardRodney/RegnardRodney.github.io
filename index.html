<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Régnard Rodney | OSI Incident Command Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c10;--surface:#0d1117;--surface2:#161b22;--surface3:#1c2330;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#e6edf3;--muted:#7d8590;--muted2:#484f58;
  --green:#3fb950;--green-dim:rgba(63,185,80,0.1);--green-g:rgba(63,185,80,0.35);
  --blue:#58a6ff;--blue-dim:rgba(88,166,255,0.1);
  --amber:#d29922;--amber-dim:rgba(210,153,34,0.1);
  --red:#f85149;--red-dim:rgba(248,81,73,0.1);
  --purple:#bc8cff;--purple-dim:rgba(188,140,255,0.1);
  --teal:#39d3bb;--teal-dim:rgba(57,211,187,0.1);
  --mono:'IBM Plex Mono',monospace;
  --display:'Syne',sans-serif;
  --body:'DM Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--body);background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden;font-size:16px;line-height:1.6} 

/* SIDEBAR */
.sidebar{width:248px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:relative;overflow:hidden;z-index:1000;}
.sidebar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--green),var(--blue),var(--purple))}
.sb-brand{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid var(--border)}
.sb-name{font-family:var(--display);font-size:15px;font-weight:700;color:var(--text)}
.sb-nav{padding:.75rem 0;flex:1;overflow-y:auto; font-size:14px;}
.nav-btn{display:flex;align-items:center;gap:8px;width:100%;background:none;border:none;color:var(--muted);padding:.5rem 1.25rem;font-family:var(--body);font-size:12px;cursor:pointer;border-left:2px solid transparent;transition:all .15s;text-align:left}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:var(--green);border-left-color:var(--green);background:var(--green-dim);font-weight:500}
#nav-dash.active { color: var(--blue); border-left-color: var(--blue); background: var(--blue-dim); }
#nav-res.active { color: var(--purple); border-left-color: var(--purple); background: var(--purple-dim); }
#nav-agent.active { color: var(--teal); border-left-color: var(--teal); background: var(--teal-dim); }

/* MAIN AREA */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative;z-index:1;}
.topbar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.5rem;justify-content:space-between;flex-shrink:0;background:var(--surface)}
.workspace{flex:1;overflow-y:auto;overflow-x:hidden;padding:1.5rem}

/* DASHBOARD GRID */
.view { display: none; }
.view.active { display: block; }
.osi-section{margin-bottom:2rem}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:1px;background:var(--border);border:1px solid var(--border);border-radius:5px;overflow:hidden}
.skill-card{background:var(--surface);padding:1.1rem 1.25rem;cursor:pointer;transition:background .15s;position:relative}
.skill-card:hover{background:var(--surface2)}
.launch-btn{display:inline-flex;align-items:center;gap:5px;background:var(--green-dim);color:var(--green);border:1px solid rgba(63,185,80,.2);padding:4px 10px;border-radius:2px;font-family:var(--mono);font-size:9px;font-weight:600;cursor:pointer;}

/* INCIDENT STREAM (THE TALKING) */
#view-incident{height:100%;gap:1rem}
.ticket-panel{width:256px;flex-shrink:0;display:flex;flex-direction:column;gap:.75rem;overflow-y:auto}
.ticket-card{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:.9rem 1.1rem}
.stream-container{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:5px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.stream-hdr{padding:.65rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.stream-body{flex:1;overflow-y:auto;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.65rem}
.msg{display:flex;flex-direction:column;animation:ma .25s ease-out}
@keyframes ma{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.bubble{padding:.65rem .9rem;border-radius:4px;font-size:12px;line-height:1.65;max-width:88%;background:var(--surface2);border:1px solid var(--border)}
.m-agent{align-self:flex-end}
.m-agent .bubble{background:rgba(88,166,255,0.1);border-color:rgba(88,166,255,0.2)}
.m-cli .bubble{background:#0d1117;border-left:3px solid var(--blue);color:#79c0ff;font-family:var(--mono);font-size:10px;white-space:pre-wrap}
.logic-note{font-family:var(--mono);font-size:9px;color:var(--amber);margin-top:5px;text-align:right;opacity:.75;font-style:italic}
.vis-card{background:var(--surface3);border-radius:5px;border:1px solid var(--border2);overflow:hidden;margin-top:10px}

/* AGENT UI */
#view-agent{max-width:900px;margin:0 auto;flex-direction:column;}
.agent-chat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;}
.agent-messages{flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1rem;}
.agent-msg.ai .agent-bubble{background:var(--teal-dim);border:1px solid rgba(57,211,187,0.3); padding:.8rem 1rem; border-radius:6px;}
.agent-msg.user .agent-bubble{background:var(--surface3);border:1px solid var(--border); align-self: flex-end; padding:.8rem 1rem; border-radius:6px;}
.typing-dot{display:inline-block;width:6px;height:6px;background:var(--teal);border-radius:50%;margin:0 2px;animation:typing 1.4s infinite;}
@keyframes typing{0%,80%,100%{transform:scale(0);}40%{transform:scale(1);}}
</style>
</head>
<body>

<nav class="sidebar">
  <div class="sb-brand">
    <div class="sb-name">Régnard Rodney</div>
    <div style="font-size:10px; color:var(--green); margin-top:5px;">Agent Online · ServiceNow</div>
  </div>
  <div class="sb-nav">
    <button class="nav-btn active" id="nav-dash" onclick="switchView('dashboard')">📊 Dashboard</button>
    <button class="nav-btn" id="nav-res" onclick="switchView('resume')">📄 Resume</button>
    <button class="nav-btn" id="nav-agent" onclick="switchView('agent')">🤖 Agent RR 2.0</button>
    <div style="font-size:9px; color:var(--muted2); padding:1rem; text-transform:uppercase;">OSI Layers</div>
    <button class="nav-btn" onclick="filterLayer(1)">L1 Physical</button>
    <button class="nav-btn" onclick="filterLayer(3)">L3 Network</button>
    <button class="nav-btn" onclick="filterLayer(7)">L7 Application</button>
  </div>
</nav>

<main class="main">
  <header class="topbar">
    <span class="topbar-title" id="header-title">Incident Dashboard</span>
    <div class="topbar-r"><span class="clock" id="live-clock"></span></div>
  </header>

  <div class="workspace">
    <div id="view-dashboard" class="view active">
      <div id="layer-sections"></div>
    </div>

    <div id="view-incident" class="view">
      <div class="ticket-panel">
        <div class="ticket-card">
          <div id="inc-number" style="color:var(--blue);font-family:var(--mono);font-size:11px;">INC000</div>
          <div id="inc-caller" style="font-weight:bold;margin-top:10px;">Caller</div>
          <div id="inc-ci" style="font-size:10px;color:var(--muted);margin-top:5px;">CI</div>
          <div id="inc-layer" style="font-size:9px;margin-top:10px;display:inline-block;padding:2px 5px;background:var(--surface3);">L0</div>
        </div>
      </div>
      <div class="stream-container">
        <div class="stream-hdr">
          <span id="stream-scenario-title" style="font-size:11px;font-weight:bold;text-transform:uppercase;">Activity Stream</span>
          <button id="next-btn" onclick="advanceIncident()" style="background:var(--blue);color:white;border:none;padding:5px 15px;border-radius:4px;cursor:pointer;font-size:11px;">NEXT STEP ▶</button>
        </div>
        <div id="stream-body" class="stream-body"></div>
      </div>
    </div>

    <div id="view-agent" class="view">
      <div id="env-alert" style="background:var(--blue-dim); border:1px solid var(--blue); padding:12px; border-radius:6px; margin-bottom:15px; font-size:12px;">
        Notice: Static Mode. For live AI, use the <a href="https://regnardrodney.netlify.app" style="color:var(--teal);">Production Netlify Link</a>.
      </div>
      <div class="agent-chat-box">
        <div id="agent-messages" class="agent-messages">
          <div class="agent-msg ai"><div class="agent-bubble">System Initialized. I am Agent RR 2.0. How can I assist?</div></div>
        </div>
        <div class="agent-input-area" style="padding:1rem; background:var(--surface2); border-top:1px solid var(--border); display:flex; gap:10px;">
          <input type="text" id="agent-input" class="agent-input" style="flex:1; background:var(--surface); border:1px solid var(--border); color:white; padding:10px; border-radius:4px;" placeholder="Ask about BGP, Cisco, or Security..." onkeypress="if(event.key==='Enter') handleAgentChat()">
          <button onclick="handleAgentChat()" style="background:var(--teal); border:none; padding:0 20px; border-radius:4px; cursor:pointer;">SEND</button>
        </div>
      </div>
    </div>

    <div id="view-resume" class="view">
        <h1 style="font-family:var(--display);">Régnard Rodney</h1>
        <p style="color:var(--blue);">Senior IT Infrastructure Specialist & CTO</p>
    </div>
  </div>
</main>

<script>
// --- SVGS ---
const svgs={
    fiber_cable:`<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="140" fill="#0a0f15"/><line x1="80" y1="70" x2="130" y2="70" stroke="#3fb950" stroke-width="3"/><circle cx="160" cy="70" r="4" fill="#f85149"/><text x="160" y="50" fill="#f85149" font-size="8" font-family="monospace" text-anchor="middle">⚠ BREAK DETECTED</text></svg>`,
    bgp_flap: `<svg viewBox="0 0 320 140" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="140" fill="#0a0f15"/><line x1="100" y1="85" x2="220" y2="85" stroke="#f85149" stroke-width="2" stroke-dasharray="4"/><text x="160" y="70" fill="#f85149" font-size="6" font-family="monospace" text-anchor="middle">BGP FLAPPING</text></svg>`
};

// --- THE TALKING (FULL SCENARIOS) ---
const scenarios=[
  {
    id:'l1-fiber', layer:1, title:'Fiber Optic Break — ISP Trunk', incNumber:'INC001-L1', caller:'NOC Alert', ci:'OS2 Fiber Trunk',
    steps:[
      {type:'system', text:'🚨 NOC ALERT: Loss of Signal (LOS) on Port 1/0/24.'},
      {type:'agent', name:'R. Rodney', text:'Good morning. I am acknowledging the P1. Checking SFP diagnostics first.', comment:'// ITIL: Own the ticket immediately.'},
      {type:'cli', text:'Router# show interface te1/0/24 transceiver\nRx Power: -40.0 dBm (Critical Low)\nTx Power: +1.2 dBm (Healthy)'},
      {type:'vis', svgKey:'fiber_cable', title:'Physical Layer Diagnostic'},
      {type:'agent', name:'R. Rodney', text:'Tx is fine, but Rx is dead. The break is in the physical fiber run. Dispatching carrier tech with OTDR.'},
      {type:'system', text:'✅ Splice complete at 2.3km marker. Signal restored to -8.2dBm.'}
    ]
  },
  {
    id:'l3-bgp', layer:3, title:'BGP Flapping — Multi-Cloud VPN', incNumber:'INC003-L3', caller:'Cloud Architecture', ci:'AWS Transit Gateway',
    steps:[
      {type:'system', text:'🚨 ALERT: BGP Adjacency flapping between AWS and Azure East.'},
      {type:'agent', name:'R. Rodney', text:'This is likely an MTU mismatch or a Hold-Timer sync issue. Checking Path MTU now.'},
      {type:'cli', text:'$ ping 169.254.21.1 -l 1472 -f\nPacket needs to be fragmented but DF set.'},
      {type:'vis', svgKey:'bgp_flap', title:'L3 Routing Triage'},
      {type:'agent', name:'R. Rodney', text:'MTU mismatch confirmed. Setting MSS Clamping to 1350 on the tunnel interface.'},
      {type:'system', text:'✅ BGP State: Established. Tunnel stabilized.'}
    ]
  }
];

const layerConfig = { 1:{name:'Physical', color:'#ef4444'}, 3:{name:'Network', color:'#58a6ff'}, 7:{name:'Application', color:'#ec4899'} };

// --- ENGINE ---
function switchView(v) {
    document.querySelectorAll('.view').forEach(view => view.style.display = 'none');
    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
    const target = document.getElementById('view-' + v);
    target.style.display = (v === 'incident' || v === 'agent') ? 'flex' : 'block';
    const btnId = 'nav-' + (v === 'dashboard' ? 'dash' : v === 'resume' ? 'res' : 'agent');
    if(document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
}

function buildDashboard() {
    const container = document.getElementById('layer-sections');
    container.innerHTML = '';
    Object.keys(layerConfig).forEach(l => {
        const lc = layerConfig[l];
        const sec = document.createElement('div');
        sec.className = 'osi-section';
        sec.innerHTML = `<h3 style="color:${lc.color}; margin-bottom:1rem;">Layer ${l} — ${lc.name}</h3><div class="grid-cards" id="l${l}-grid"></div>`;
        container.appendChild(sec);
        const grid = sec.querySelector('.grid-cards');
        scenarios.filter(s => s.layer == l).forEach(sc => {
            const card = document.createElement('div');
            card.className = 'skill-card';
            card.innerHTML = `<h4>${sc.title}</h4><p style="font-size:11px;color:var(--muted)">${sc.ci}</p><button class="launch-btn" onclick="startIncident('${sc.id}')" style="margin-top:10px;">Launch Sim</button>`;
            grid.appendChild(card);
        });
    });
}

let currentS=null, stepIdx=0;
function startIncident(id) {
    currentS = scenarios.find(s => s.id === id); stepIdx = 0;
    document.getElementById('inc-number').textContent = currentS.incNumber;
    document.getElementById('inc-caller').textContent = currentS.caller;
    document.getElementById('inc-ci').textContent = currentS.ci;
    document.getElementById('inc-layer').textContent = 'L' + currentS.layer;
    document.getElementById('stream-body').innerHTML = '';
    switchView('incident');
    advanceIncident();
}

function advanceIncident() {
    if(!currentS || stepIdx >= currentS.steps.length) return;
    const step = currentS.steps[stepIdx];
    const body = document.getElementById('stream-body');
    const wrap = document.createElement('div');
    wrap.className = 'msg ' + (step.type === 'agent' ? 'm-agent' : step.type === 'cli' ? 'm-cli' : '');
    
    if(step.type === 'vis') {
        wrap.innerHTML = `<div class="vis-card"><div style="padding:5px;font-size:9px;color:var(--muted)">${step.title}</div>${svgs[step.svgKey]}</div>`;
    } else {
        wrap.innerHTML = `<div class="bubble"><strong>${step.name || 'SYSTEM'}:</strong> ${step.text}${step.comment ? `<div class="logic-note">${step.comment}</div>` : ''}</div>`;
    }
    
    body.appendChild(wrap);
    body.scrollTop = body.scrollHeight;
    stepIdx++;
}

async function handleAgentChat() {
    const input = document.getElementById('agent-input');
    const text = input.value.trim();
    if(!text) return;
    const container = document.getElementById('agent-messages');
    const userDiv = document.createElement('div');
    userDiv.className = 'agent-msg user';
    userDiv.innerHTML = `<div class="agent-bubble">${text}</div>`;
    container.appendChild(userDiv);
    input.value = '';
    
    const typing = document.createElement('div');
    typing.className = 'agent-msg ai';
    typing.innerHTML = `<div class="agent-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    container.appendChild(typing);
    container.scrollTop = container.scrollHeight;

    try {
        const response = await fetch('/.netlify/functions/agent', { method: 'POST', body: JSON.stringify({ message: text }) });
        const data = await response.json();
        container.removeChild(typing);
        const aiDiv = document.createElement('div');
        aiDiv.className = 'agent-msg ai';
        aiDiv.innerHTML = `<div class="agent-bubble">${data.reply}</div>`;
        container.appendChild(aiDiv);
    } catch {
        container.removeChild(typing);
        const errDiv = document.createElement('div');
        errDiv.className = 'agent-msg ai';
        errDiv.innerHTML = `<div class="agent-bubble">AI backend live on Netlify link.</div>`;
        container.appendChild(errDiv);
    }
    container.scrollTop = container.scrollHeight;
}

// --- INIT ---
setInterval(() => { document.getElementById('live-clock').textContent = new Date().toLocaleTimeString(); }, 1000);
buildDashboard();
window.addEventListener('DOMContentLoaded', () => { if (window.location.hostname.includes('netlify.app')) document.getElementById('env-alert').style.display = 'none'; });
</script>
</body>
</html>
